services:
  - type: web
    name: careerpulse-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: validate
      - key: CORS_ALLOWED_ORIGINS
        value: https://careerpulse-web-zrkl.onrender.com

  - type: web
    name: careerpulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://careerpulse-api-t17q.onrender.com/api
